name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # RULES.md P1: a configured rule that never fires protects nothing.
      - name: Prove the choke-point lint rule fires
        run: pnpm lint:prove

      - name: Unit + integration tests
        run: pnpm test

      - name: Build both browser targets
        run: pnpm build

      # The check that reasons about the shipped artefact rather than the source, so
      # no config exemption can smuggle a network call into a denied context.
      - name: No network API outside the egress module
        run: pnpm check:bundle

      # H5. The only place the manifest, the service-worker lifecycle, content-script
      # injection and the CSP are all true at once. A node test cannot see any of them:
      # bug #5 passed 122 of them while the extension was completely dead.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:e2e

      - name: Upload built extensions
        uses: actions/upload-artifact@v4
        with:
          name: prahari-extensions
          path: |
            packages/extension/dist-chrome
            packages/extension/dist-firefox
          retention-days: 14

  # The server half. A separate job because it needs a Python toolchain, and because
  # the parity fixture is regenerated by Python — if the two PII packs ever disagree,
  # the regenerated corpus differs from the committed one and this job fails (F4).
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r server/requirements-dev.txt

      - name: Server tests — ingress guard, prompt validation, decode ladder
        run: cd server && python -m pytest tests/ -q

      # The TypeScript side asserts these same verdicts. A diff here means the two
      # implementations of the PII pack have drifted, which is exactly how the
      # ingress guard quietly stops being an independent check.
      - name: Fail if the TS/Python parity corpus drifted
        run: git diff --exit-code -- packages/eval/fixtures/parity-corpus.json

  # Placeholder for the BLOCKING canary job (ticket H3, Phase 3). It is declared now so
  # that adding the suite is a one-line change rather than a CI redesign, and so the
  # gap is visible in every PR.
  privacy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO(H3) canary suite — becomes a required, blocking check in Phase 3"
