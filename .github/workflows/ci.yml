name: CI

on:
  push:
    branches: [main]

  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Uses the pnpm version defined in package.json
      # e.g. "packageManager": "pnpm@11.25.0"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # RULES.md P1: a configured rule that never fires protects nothing.
      - name: Prove the choke-point lint rule fires
        run: pnpm lint:prove

      - name: Unit + integration tests
        run: pnpm test

      - name: Build both browser targets
        run: pnpm build

      # The check reasons about the shipped artifact rather than only the source.
      - name: No network API outside the egress module
        run: pnpm check:bundle

      # Install Chromium for browser tests.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:e2e

      - name: Upload built extensions
        uses: actions/upload-artifact@v4
        with:
          name: prahari-extensions
          path: |
            packages/extension/dist-chrome
            packages/extension/dist-firefox
          retention-days: 14

  # Server-side tests
  server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r server/requirements-dev.txt

      - name: Server tests — ingress guard, prompt validation, decode ladder
        run: cd server && python -m pytest tests/ -q

      # Checks whether the TypeScript/Python parity corpus has changed.
      - name: Fail if the TS/Python parity corpus drifted
        run: git diff --exit-code -- packages/eval/fixtures/parity-corpus.json

  # Placeholder for the blocking canary suite.
  privacy:
    runs-on: ubuntu-latest

    steps:
      - name: Privacy placeholder
        run: echo "TODO(H3) canary suite — becomes a required, blocking check in Phase 3"
