[project]
name = "prahari-server"
version = "0.1.0"
description = "MANTRI - redaction-aware planner for the PRAHARI browser agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "redis>=5.2",
  # Read by the eval CLI so a key can live in `server/.env` instead of a shell
  # export. It arrives with uvicorn[standard] anyway; declared because depending on
  # a transitive dependency is depending on someone else's packaging decision.
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["app", "mantri"]
